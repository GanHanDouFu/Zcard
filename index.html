<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f9f8f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Zcard - 让每一条视频都变成你的知识</title>
    <link rel="stylesheet" href="style.css?v=20260509-demo-key">
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 html2canvas 用于导出图片 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="logo-container">
                <i data-lucide="book-open" class="logo-icon"></i>
                <div class="logo-text">
                    <h1>Zcard</h1>
                    <p class="slogan">让每一条视频都变成你的知识</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="btn-flashcard" class="btn btn-secondary">
                    <i data-lucide="layers"></i> 复习模式
                </button>
                <button id="btn-settings" class="btn btn-icon" title="设置 API Key">
                    <i data-lucide="settings"></i>
                </button>
            </div>
        </header>

        <main class="main-content">
            <section id="review-section" class="review-section hidden">
                <div class="review-card" id="review-card">
                    <div class="review-meta">
                        <i data-lucide="book-marked"></i>
                        <span>今日复习</span>
                    </div>
                    <h2 id="review-title">卡片标题</h2>
                    <p id="review-core">核心观点</p>
                    <div class="review-actions">
                        <button id="btn-review-do" class="btn btn-primary">复习</button>
                        <button id="btn-review-skip" class="btn btn-secondary">跳过</button>
                    </div>
                </div>
            </section>

            <!-- 输入区 -->
            <section class="input-section" id="compose-section">
                <div class="input-wrapper">
                    <textarea id="video-input" placeholder="粘贴抖音视频文案或链接到这里..." rows="3"></textarea>
                    <button id="btn-generate" class="btn btn-primary">
                        <i data-lucide="sparkles"></i> 生成知识卡片
                    </button>
                </div>
                <div id="loading-indicator" class="loading hidden">
                    <div class="spinner"></div>
                    <span>AI 正在为您提炼知识...</span>
                </div>
            </section>

            <!-- 工具栏：分类与搜索 -->
            <section class="toolbar">
                <div class="categories" id="category-list">
                    <button class="category-tag active" data-category="全部">全部</button>
                    <button class="category-tag" data-category="待办">
                        <i data-lucide="check-circle" class="sm-icon"></i> 待办
                    </button>
                    <button class="category-tag" data-category="生活">生活</button>
                    <button class="category-tag" data-category="职场">职场</button>
                    <button class="category-tag" data-category="学习">学习</button>
                    <button class="category-tag" data-category="娱乐">娱乐</button>
                    <button class="category-tag" data-category="财经">财经</button>
                    <button class="category-tag" data-category="健康">健康</button>
                    <button class="category-tag" data-category="科技">科技</button>
                </div>

                <div class="search-actions">
                    <div class="search-box">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" id="search-input" placeholder="在【全部】中搜索...">
                        <button id="btn-clear-search" class="search-clear hidden" title="清空搜索">
                            <i data-lucide="x"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- 批量操作栏（默认隐藏） -->
            <section id="batch-actions" class="batch-actions hidden">
                <span class="selected-count">已选择 <strong id="selected-num">0</strong> 张卡片</span>
                <div class="batch-btns">
                    <button id="btn-integrate" class="btn btn-primary">
                        <i data-lucide="git-merge"></i> 整合卡片
                    </button>
                    <button id="btn-export" class="btn btn-secondary">
                        <i data-lucide="image"></i> 导出图片
                    </button>
                    <button id="btn-cancel-select" class="btn btn-text">取消选择</button>
                </div>
            </section>

            <!-- 卡片展示区 -->
            <section class="cards-container" id="cards-container">
                <!-- 卡片将通过 JS 动态生成 -->
                <div class="empty-state hidden" id="empty-state">
                    <i data-lucide="inbox" class="empty-icon"></i>
                    <p>还没有知识卡片，快去粘贴文案生成一张吧！</p>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="底部导航">
            <button class="bottom-nav-item active" data-mobile-action="cards">
                <i data-lucide="layout-dashboard"></i>
                <span>卡片</span>
            </button>
            <button class="bottom-nav-item" data-mobile-action="compose">
                <i data-lucide="plus-circle"></i>
                <span>生成</span>
            </button>
            <button class="bottom-nav-item" data-mobile-action="review">
                <i data-lucide="layers"></i>
                <span>复习</span>
            </button>
            <button class="bottom-nav-item" data-mobile-action="settings">
                <i data-lucide="settings"></i>
                <span>设置</span>
            </button>
        </nav>
    </div>

    <!-- 搜索结果弹窗 -->
    <div id="search-modal" class="modal hidden">
        <div class="modal-content search-modal-content">
            <button class="close-btn" id="btn-close-search"><i data-lucide="x"></i></button>
            <div class="search-result-head">
                <span class="detail-badge">搜索结果</span>
                <h2 id="search-result-title">搜索结果</h2>
                <p id="search-result-count">共找到 0 张卡片</p>
            </div>
            <div id="search-results" class="search-results"></div>
        </div>
    </div>

    <!-- 卡片操作弹窗 -->
    <div id="action-modal" class="modal hidden">
        <div class="modal-content action-sheet">
            <h3>选择操作</h3>
            <button id="btn-action-detail" class="btn btn-primary">查看详情</button>
            <a id="btn-action-douyin" class="btn btn-secondary" target="_blank" rel="noopener">跳转抖音</a>
            <button id="btn-action-cancel" class="btn btn-text">取消</button>
        </div>
    </div>

    <!-- 卡片详情弹窗 -->
    <div id="card-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" id="btn-close-modal"><i data-lucide="x"></i></button>
            <div id="modal-card-body" class="card-detail-body">
                <!-- 详情内容动态填充 -->
            </div>
            <div class="modal-footer">
                <a id="modal-source-link" href="#" target="_blank" class="btn btn-text hidden">
                    <i data-lucide="external-link"></i> 原视频链接
                </a>
                <button id="btn-edit-card" class="btn btn-secondary">
                    <i data-lucide="pencil"></i> 编辑内容
                </button>
                <button id="btn-save-card" class="btn btn-primary hidden">
                    <i data-lucide="save"></i> 保存
                </button>
                <button id="btn-cancel-edit" class="btn btn-text hidden">取消编辑</button>
                <button id="btn-open-notebook" class="btn btn-secondary">
                    <i data-lucide="notebook-pen"></i> 生成记事本
                </button>
                <button id="btn-add-todo" class="btn btn-secondary">
                    <i data-lucide="list-todo"></i> 加入待办
                </button>
                <button id="btn-delete-card" class="btn btn-danger">
                    <i data-lucide="trash-2"></i> 删除
                </button>
            </div>
        </div>
    </div>

    <!-- 记事本弹窗 -->
    <div id="notebook-modal" class="modal hidden">
        <div class="modal-content notebook-content">
            <button class="close-btn" id="btn-close-notebook"><i data-lucide="x"></i></button>
            <span class="detail-badge">记事本</span>
            <h2>二次编辑</h2>
            <textarea id="notebook-input" class="notebook-input" placeholder="写下你的理解、改写、行动计划..."></textarea>
            <div class="modal-footer">
                <button id="btn-save-notebook" class="btn btn-primary">保存记事本</button>
            </div>
        </div>
    </div>

    <!-- 闪卡复习弹窗 -->
    <div id="flashcard-modal" class="modal hidden">
        <div class="modal-content flashcard-container">
            <button class="close-btn" id="btn-close-flashcard"><i data-lucide="x"></i></button>
            <div class="flashcard-header">
                <h3>知识复习</h3>
                <span id="flashcard-progress" class="progress">1 / 5</span>
            </div>
            <div class="flashcard-scene" id="flashcard-scene">
                <div class="flashcard" id="flashcard-element">
                    <!-- 正面 -->
                    <div class="flashcard-face flashcard-front">
                        <span class="category-badge" id="fc-category">领域</span>
                        <h2 id="fc-title">卡片标题</h2>
                        <p class="flip-hint"><i data-lucide="rotate-cw"></i> 点击翻转</p>
                    </div>
                    <!-- 反面 -->
                    <div class="flashcard-face flashcard-back">
                        <div class="fc-content">
                            <p class="fc-core" id="fc-core">核心观点</p>
                            <ul class="fc-points" id="fc-points"></ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flashcard-actions hidden" id="flashcard-actions">
                <button id="btn-fc-forget" class="btn btn-warning">没记住</button>
                <button id="btn-fc-remember" class="btn btn-success">记住了</button>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content settings-content">
            <button class="close-btn" id="btn-close-settings"><i data-lucide="x"></i></button>
            <h2>设置</h2>
            <form class="settings-form" autocomplete="off" onsubmit="return false;">
                <label for="api-key-input">DeepSeek API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-...">
                <p class="help-text">静态演示版会从浏览器直连 DeepSeek，API Key 仅保存在当前标签页会话中；正式上线请改用后端代理。</p>
            </form>
            <div class="modal-footer">
                <button id="btn-save-settings" class="btn btn-primary">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 用于导出图片的隐藏容器 -->
    <div id="export-container" class="export-container hidden"></div>

    <script src="script.js?v=20260509-demo-key"></script>
</body>
</html>
